name: 'Setup Android Environment'
description: 'Standard setup for Android CI'

inputs:
  jdk-version:
    description: 'JDK Version'
    required: true
    default: '17'
  java-distribution:
    description: 'Java Distribution (e.g., temurin, zulu, corretto)'
    required: true
    default: 'temurin'
  dotenv:
    description: 'Content for .env file'
    required: false
  google-services-json:
    description: 'Base64 encoded google-services.json'
    required: false

runs:
  using: "composite"
  steps:
    - name: Create .env
      shell: bash
      run: |
        if [ "${{ inputs.dotenv }}" != "" ]; then
          echo "${{ inputs.dotenv }}" > .env
          cp .env .env.example
        else
          echo "DOTENV is missing! Creating dummy files to avoid build failure."
          touch .env
          touch .env.example
        fi

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.jdk-version }}

    - name: Setup Android SDK
      shell: bash
      run: |
        # ubuntu-24.04 runners ship the Android SDK; this only normalizes the env
        # vars and accepts licenses. android-actions/setup-android@v2 doesn't
        # recognize newer license text (e.g. the SDK Preview license) and exits 1.
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -type f -name sdkmanager | sort -r | head -n1)"
        yes | "$SDKMANAGER" --licenses --sdk_root="$SDK_ROOT" > /dev/null 2>&1 || true

    - name: Create local.properties
      shell: bash
      run: |
        echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties

    - name: Create google-services.json
      shell: bash
      run: |
        if [ "${{ inputs.google-services-json }}" != "" ]; then
          echo "${{ inputs.google-services-json }}" | base64 --decode > app/google-services.json
        fi

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
